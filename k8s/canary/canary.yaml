apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-canary
  namespace: lab4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lab4-canary-demo
      track: canary
  template:
    metadata:
      labels:
        app: lab4-canary-demo
        track: canary
    spec:
      containers:
        - name: app
          image: lab4-devops-app:1.1
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: app-canary-demo
  namespace: lab4
spec:
  selector:
    app: lab4-canary-demo
  ports:
    - port: 80
      targetPort: 5000
