apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-blue
  namespace: lab4
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lab4-app
      version: blue
  template:
    metadata:
      labels:
        app: lab4-app
        version: blue
    spec:
      containers:
        - name: app
          image: lab4-devops-app:1.0
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet: {path: /ready, port: 5000}
---
apiVersion: v1
kind: Service
metadata:
  name: app-live
  namespace: lab4
spec:
  selector:
    app: lab4-app
    version: blue
  ports:
    - port: 80
      targetPort: 5000
