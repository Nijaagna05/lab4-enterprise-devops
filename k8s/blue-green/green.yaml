apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-green
  namespace: lab4
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lab4-app
      version: green
  template:
    metadata:
      labels:
        app: lab4-app
        version: green
    spec:
      containers:
        - name: app
          image: lab4-devops-app:1.1
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet: {path: /ready, port: 5000}
